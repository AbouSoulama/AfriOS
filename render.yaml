# Render Blueprint — fixed public URL for AfriOS API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: afrios-api
    runtime: docker
    rootDir: api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: afrios-db
          # External hostname resolves more reliably than the short internal DNS name.
          property: externalConnectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_DEV_MODE
        value: "true"
      # Remplir dans le dashboard Render pour SMS réel, puis OTP_DEV_MODE=false :
      # AFRICAS_TALKING_API_KEY
      # AFRICAS_TALKING_USERNAME (sandbox ou prod)
      # AFRICAS_TALKING_SENDER
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: APP_NAME
        value: AfriOS API
      - key: CINETPAY_NOTIFY_URL
        value: https://afrios-api.onrender.com/v1/webhooks/cinetpay
      - key: CINETPAY_RETURN_URL
        value: afrios://payment/success
      - key: CINETPAY_SANDBOX
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://afrios-api.onrender.com
      - key: JOBS_CRON_SECRET
        generateValue: true
      # Optional — fill in Render dashboard if you use them:
      # OPENAI_API_KEY
      # CINETPAY_API_KEY / CINETPAY_SITE_ID

databases:
  - name: afrios-db
    plan: free
    databaseName: afrios
    user: afrios
