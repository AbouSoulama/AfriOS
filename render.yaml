# Render Blueprint — fixed public URL for AfriOS API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: afrios-api
    runtime: docker
    rootDir: api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: afrios-db
          # External hostname resolves more reliably than the short internal DNS name.
          property: externalConnectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_DEV_MODE
        value: "false"
      # Obliger pour SMS réel :
      # AFRICAS_TALKING_API_KEY
      # AFRICAS_TALKING_USERNAME
      # AFRICAS_TALKING_SENDER (optionnel)
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: APP_NAME
        value: AfriOS API
      - key: FEDAPAY_CALLBACK_URL
        value: https://afrios-api.onrender.com/v1/webhooks/fedapay
      - key: FEDAPAY_RETURN_URL
        value: afrios://payment/success
      - key: FEDAPAY_SANDBOX
        value: "true"
      # Obliger pour paiements réels FedaPay :
      # FEDAPAY_SECRET_KEY
      # FEDAPAY_PUBLIC_KEY
      - key: PUBLIC_BASE_URL
        value: https://afrios-api.onrender.com
      - key: JOBS_CRON_SECRET
        generateValue: true

databases:
  - name: afrios-db
    plan: free
    databaseName: afrios
    user: afrios
