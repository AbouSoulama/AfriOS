name: afrios
description: AfriOS — L'OS des PME africaines
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  device_info_plus: ^11.3.0
  intl_phone_field: ^3.2.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  freezed: ^2.5.7
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/afrios_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/afrios_logo.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
