services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afrios
      POSTGRES_PASSWORD: afrios_dev
      POSTGRES_DB: afrios
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/supabase/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://afrios:afrios_dev@postgres:5432/afrios
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production
      OTP_DEV_MODE: "true"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
